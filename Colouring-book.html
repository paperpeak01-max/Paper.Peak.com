<!DOCTYPE html>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #e7f5ff;

  color: #205580;

  text-align: center;

}

header {

  background: #91cfff;

  padding: 20px;

}

header h1 {

  margin: 0;

  font-size: 30px;

}

nav { padding: 15px; }

nav a {

  color: #205580;

  font-weight: bold;

  text-decoration: none;

}

button {

  border: none;

  border-radius: 30px;

  padding: 14px 25px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  background: #258bd0;

  color: white;

  margin: 8px;

}

button:hover { background: #176ba8; }

#cover {

  max-width: 550px;

  margin: 20px auto;

  padding: 20px;

}

.cover-art {

  background: linear-gradient(#8bd5ff, #e9faff);

  border: 5px solid white;

  border-radius: 25px;

  box-shadow: 0 8px 25px #7ab6dc55;

  padding: 15px;

}

.cover-art h2 {

  font-size: 38px;

  color: #176ba8;

}

.cover-art svg {

  width: 100%;

  max-height: 350px;

}

#book {

  display: none;

  max-width: 750px;

  margin: 20px auto;

  padding: 15px;

}

.paper {

  background: white;

  border: 2px solid #205580;

  box-shadow: 0 6px 20px #5089ad33;

  padding: 12px;

  border-radius: 5px;

}

.paper h2 {

  font-size: 23px;

  margin: 8px;

}

.paper svg {

  width: 100%;

  height: auto;

  display: block;

}

.page-label {

  font-weight: bold;

  margin: 12px;

}

#pageNumber {

  font-weight: bold;

}

footer {

  background: #91cfff;

  padding: 20px;

  margin-top: 35px;

}

@media print {

  header, nav, footer, .controls, #cover {

    display: none !important;

  }

  body { background: white; }

  #book {

    display: block !important;

    max-width: 100%;

    margin: 0;

  }

  .paper {

    box-shadow: none;

    border: none;

  }

}

</style>

let currentPage = 0;

function brandMark() {

  return `

    <text x="200" y="385"

      text-anchor="middle"

      font-size="23"

      font-family="Arial"

      font-weight="bold"

      fill="white"

      stroke="black"

      stroke-width="0.7">

      Paper Peak

    </text>

    <path d="M20 385 H100 M300 385 H380"

      stroke="black" stroke-width="2"/>

  `;

}

function renderPage() {

  const page = pages[currentPage];

  document.getElementById("drawing").innerHTML = `

    <svg viewBox="0 0 400 410"

         xmlns="http://www.w3.org/2000/svg"

         role="img"

         aria-label="${page.title} coloring page">

      <rect x="2" y="2" width="396" height="406"

            rx="12" fill="white"

            stroke="black" stroke-width="2"/>

      <text x="200" y="35"

            text-anchor="middle"

            font-family="Arial"

            font-size="23"

            font-weight="bold"

            fill="white"

            stroke="black"

            stroke-width="0.8">

        ♡ Paper Peak ♡

      </text>

      <g stroke-linecap="round"

         stroke-linejoin="round">

        ${page.art}

      </g>

      ${brandMark()}

    </svg>

  `;

  document.getElementById("pageTitle").textContent =

    page.title;

  document.getElementById("pageNumber").textContent =

    "Page " + (currentPage + 1) +

    " of " + pages.length;

}

function openBook() {

  document.getElementById("cover").style.display = "none";

  document.getElementById("book").style.display = "block";

  currentPage = 0;

  renderPage();

  window.scrollTo(0, 0);

}

function nextPage() {

  if (currentPage < pages.length - 1) {

    currentPage++;

    renderPage();

  } else {

    alert("You reached the end of the coloring book! 💙");

  }

}

function previousPage() {

  if (currentPage > 0) {

    currentPage--;

    renderPage();

  } else {

    alert("You're on the first page! 💖");

  }

}

function backToCover() {

  document.getElementById("book").style.display = "none";

  document.getElementById("cover").style.display = "block";

  window.scrollTo(0, 0);

}

function printPage() {

  window.print();

}
