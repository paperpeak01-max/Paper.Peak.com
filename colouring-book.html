
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Peak Coloring Book</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff0f7;
      color: #333;
    }

    header {
      background: #ffb6d5;
      padding: 25px;
      color: #7a2450;
    }

    nav {
      background: white;
      padding: 15px;
    }

    nav a {
      margin: 10px;
      color: #a52a66;
      text-decoration: none;
      font-weight: bold;
    }

    .book {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px #e7b6ce;
    }

    svg {
      width: 100%;
      max-width: 500px;
      border: 3px dashed #ffb6d5;
      border-radius: 15px;
      background: white;
    }

    button {
      margin: 8px;
      padding: 14px 22px;
      border: none;
      border-radius: 25px;
      background: #ff78b5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e84d95;
    }

    .back {
      display: inline-block;
      margin: 20px;
      padding: 14px 22px;
      background: #7ccf9b;
      color: #174e2c;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    @media print {
      header, nav, button, .back, footer, p {
        display: none;
      }

      body, .book {
        background: white;
        box-shadow: none;
        margin: 0;
      }

      svg {
        border: none;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Paper Peak Coloring Book</h1>
  <p>Reach New Heights with Stationery!</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="free-stuff.html">Free Stuff</a>
</nav>

<div class="book">

  <h2>Welcome to Your Free Coloring Book!</h2>
  <p>Choose a page and enjoy colouring!</p>

  <h3 id="title">Happy Pencil</h3>

  <p id="number">Page 1 of 6</p>

  <svg id="picture" viewBox="0 0 500 500"
       xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="500" fill="white"/>
    <g fill="white" stroke="black" stroke-width="5"
       stroke-linejoin="round" stroke-linecap="round">
      <rect x="180" y="100" width="140" height="280" rx="25"/>
      <path d="M180 150 H320 M180 330 H320"/>
      <path d="M180 100 L250 35 L320 100"/>
      <circle cx="225" cy="230" r="10"/>
      <circle cx="275" cy="230" r="10"/>
      <path d="M220 270 Q250 300 280 270"/>
    </g>
  </svg>

  <div>
    <button onclick="previous()">⬅ Previous</button>
    <button onclick="next()">Next ➡</button>
    <button onclick="window.print()">🖨 Print</button>
  </div>

</div>

<a class="back" href="free-stuff.html">Back to Free Stuff</a>

<footer>
  <p>© 2026 Paper Peak</p>
</footer>

<script>
  const pages = [
    {
      name: "Happy Pencil",
      art: `
        <rect x="180" y="100" width="140" height="280" rx="25"/>
        <path d="M180 150 H320 M180 330 H320"/>
        <path d="M180 100 L250 35 L320 100"/>
        <circle cx="225" cy="230" r="10"/>
        <circle cx="275" cy="230" r="10"/>
        <path d="M220 270 Q250 300 280 270"/>
      `
    },
    {
      name: "Cute Notebook",
      art: `
        <rect x="130" y="90" width="240" height="320" rx="20"/>
        <path d="M180 90 V410 M130 160 H370 M130 220 H370"/>
        <circle cx="155" cy="130" r="8"/>
        <circle cx="155" cy="190" r="8"/>
        <circle cx="250" cy="250" r="30"/>
        <circle cx="240" cy="245" r="4"/>
        <circle cx="260" cy="245" r="4"/>
        <path d="M240 260 Q250 270 260 260"/>
      `
    },
    {
      name: "Smiling Star",
      art: `
        <path d="M250 55 L305 180 L440 190 L335 280
        L365 420 L250 345 L135 420 L165 280
        L60 190 L195 180 Z"/>
        <circle cx="220" cy="230" r="10"/>
        <circle cx="280" cy="230" r="10"/>
        <path d="M215 275 Q250 310 285 275"/>
      `
    },
    {
      name: "Pretty Flower",
      art: `
        <circle cx="250" cy="170" r="50"/>
        <circle cx="250" cy="90" r="50"/>
        <circle cx="330" cy="170" r="50"/>
        <circle cx="250" cy="250" r="50"/>
        <circle cx="170" cy="170" r="50"/>
        <path d="M250 250 V430"/>
        <path d="M250 340 Q150 270 140 360 Q190 400 250 340"/>
        <path d="M250 380 Q350 300 370 390 Q310 440 250 380"/>
        <circle cx="235" cy="165" r="6"/>
        <circle cx="265" cy="165" r="6"/>
        <path d="M230 190 Q250 210 270 190"/>
      `
    },
    {
      name: "Happy Sun",
      art: `
        <circle cx="250" cy="240" r="100"/>
        <path d="M250 60 V100 M250 380 V420
        M70 240 H110 M390 240 H430
        M120 110 L150 140 M350 340 L380 370
        M120 370 L150 340 M350 140 L380 110"/>
        <circle cx="220" cy="225" r="10"/>
        <circle cx="280" cy="225" r="10"/>
        <path d="M210 270 Q250 310 290 270"/>
      `
    },
    {
      name: "Lovely Heart",
      art: `
        <path d="M250 400
        C180 330 60 240 100 150
        C130 80 220 100 250 170
        C280 100 370 80 400 150
        C440 240 320 330 250 400 Z"/>
        <circle cx="210" cy="220" r="10"/>
        <circle cx="290" cy="220" r="10"/>
        <path d="M210 260 Q250 300 290 260"/>
      `
    }
  ];

  let current = 0;

  function showPage() {
    document.getElementById("title").textContent =
      pages[current].name;

    document.getElementById("number").textContent =
      "Page " + (current + 1) + " of " + pages.length;

    document.getElementById("picture").innerHTML =
      '<rect width="500" height="500" fill="white"/>' +
      '<g fill="white" stroke="black" stroke-width="5" ' +
      'stroke-linejoin="round" stroke-linecap="round">' +
      pages[current].art +
      '</g>';
  }

  function next() {
    current = (current + 1) % pages.length;
    showPage();
  }

  function previous() {
    current = (current - 1 + pages.length) % pages.length;
    showPage();
  }

  showPage();
</script>

</body>
</html>
